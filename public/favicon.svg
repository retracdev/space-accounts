<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Tile -->
    <linearGradient id="sa-tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3CC"/>
      <stop offset="0.5" stop-color="#FAE7A5"/>
      <stop offset="1" stop-color="#EFC45E"/>
    </linearGradient>
    <linearGradient id="sa-tile-rim" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="sa-tile-clip"><rect width="64" height="64" rx="14.5"/></clipPath>

    <!-- Main glyph: person -->
    <g id="sa-person">
      <circle cx="32" cy="22.5" r="9.5"/>
      <path d="M15.5 49.5C15.5 40.2 22.8 34 32 34s16.5 6.2 16.5 15.5c0 1.4-1.1 2.5-2.5 2.5H18c-1.4 0-2.5-1.1-2.5-2.5Z"/>
    </g>
    <linearGradient id="sa-glyph" x1="0" y1="12" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#FFF4D2" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="sa-glyph-rim" x1="0" y1="12" x2="0" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="sa-person-clip">
      <circle cx="32" cy="22.5" r="9.5"/>
      <path d="M15.5 49.5C15.5 40.2 22.8 34 32 34s16.5 6.2 16.5 15.5c0 1.4-1.1 2.5-2.5 2.5H18c-1.4 0-2.5-1.1-2.5-2.5Z"/>
    </clipPath>
    <mask id="sa-outside-person" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#sa-person" fill="#000"/>
    </mask>
    <filter id="sa-blur-main" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- 1. Tile -->
  <rect width="64" height="64" rx="14.5" fill="url(#sa-tile)"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.9" fill="none" stroke="url(#sa-tile-rim)" stroke-width="1.2"/>

  <!-- 2. Glyph shadow (outside the glyph, inside the tile) -->
  <g clip-path="url(#sa-tile-clip)">
    <g mask="url(#sa-outside-person)">
      <use href="#sa-person" transform="translate(0 2.5)" fill="#8A5200" fill-opacity="0.46" filter="url(#sa-blur-main)"/>
    </g>
  </g>

  <!-- 3. Glyph -->
  <use href="#sa-person" fill="url(#sa-glyph)"/>
  <g clip-path="url(#sa-person-clip)">
    <use href="#sa-person" fill="none" stroke="url(#sa-glyph-rim)" stroke-width="2"/>
  </g>
</svg>
