<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07060d" />
    <meta name="description" content="Your account for retrac.space." />
    <title>Account · retrac.space</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <canvas id="bgcanvas" aria-hidden="true"></canvas>
    <div class="background-veil" aria-hidden="true"></div>
    <header>
      <a
        class="brand"
        href="https://retrac.space"
        aria-label="retrac.space home"
        ><img
          src="/brand/logo.png"
          alt="retrac.space"
          width="1920"
          height="1080" /></a
      ><span class="header-label"
        ><img src="/brand/account.png" alt="" width="24" height="24" /> Your
        account</span
      >
    </header>
    <div class="hero">
      <p class="title">
        <span class="sr-only">accounts</span>
        <canvas id="title" aria-hidden="true"></canvas>
      </p>
    </div>
    <nav
      class="mode-cards"
      id="mode-cards"
      aria-label="Sign in or create an account"
      hidden
    ></nav>
    <main id="content" tabindex="-1">
      <p role="status">Loading your account…</p>
    </main>
    <footer>
      <a href="https://retrac.space">Back to retrac.space</a
      ><span>One account. Your space.</span>
    </footer>
    <noscript
      ><p>JavaScript is needed to securely manage your account.</p></noscript
    >
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
